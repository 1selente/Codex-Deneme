<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101322">
  <meta name="description" content="AI Startup Tycoon: sıfırdan yapay zekâ girişimi kurduğun strateji ve ekonomi oyunu.">
  <title>AI Startup Tycoon — İlk Oynanabilir Sürüm</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="game-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">✦</div><div><strong>AI STARTUP</strong><span>TYCOON / PRE-ALPHA</span></div></div>
      <nav id="navigation" class="navigation" aria-label="Oyun menüsü">
        <button data-view="dashboard" class="nav-link selected"><span>▦</span> Genel Bakış</button>
        <button data-view="research" class="nav-link"><span>⬡</span> Araştırma</button>
        <button data-view="products" class="nav-link"><span>◈</span> Ürünler</button>
        <button data-view="team" class="nav-link"><span>♙</span> Ekip ve Altyapı</button>
        <button data-view="market" class="nav-link"><span>⌁</span> Pazar ve Rakipler</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="eyebrow">KURUCUNUN NOTU</div>
        <p>En güçlü modeli değil, en iyi şirketi kur.</p>
        <button class="outline-button full-width" id="new-game" type="button">↺ Yeni Oyun</button>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="company-head">
          <div class="eyebrow">ŞİRKETİN / YÖNETİM PANELİ</div>
          <button id="rename-company" title="Şirket adını değiştir" class="company-name" type="button">NovaMind Labs <span>✎</span></button>
        </div>
        <div class="top-actions">
          <div class="week-chip"><span class="status-dot"></span> HAFTA <b id="week-count">01</b></div>
          <button class="outline-button" id="save-game" type="button">↓ Kaydet</button>
          <button class="primary-button" id="next-week" type="button">Haftayı İlerlet <span>→</span></button>
        </div>
      </header>

      <main class="main-content">
        <div id="metrics" class="metrics" aria-label="Şirket istatistikleri"></div>
        <div id="view-content" aria-live="polite"></div>
        <footer class="footer"><span>AI STARTUP TYCOON • Oynanabilir prototip v0.1</span><span>Veriler kurgusal simülasyondur · Çevrimdışı oynanır</span></footer>
      </main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="./engine.js"></script>
  <script src="./app.js"></script>
</body>
</html>
