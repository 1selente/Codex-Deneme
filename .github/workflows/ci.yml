name: BIST Signal Lab CI

on:
  push:
    branches: [bist-signal-lab]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Pytest
        run: pytest --cov=src/bist_signal_bot --cov-report=term-missing
