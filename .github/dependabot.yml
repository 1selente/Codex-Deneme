version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "bist-signal-lab"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "bist-signal-lab"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
