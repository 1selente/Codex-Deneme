function renderFinance(){const f=E.forecast(game),val=E.valuation(game),asset=game.planes.filter(p=>!p.leased).reduce((a,p)=>a+plane(p.model).price*(1-p.wear*.0026),0);return `${head('MALİ İŞLER','Finans Merkezi','Gelir-gider tabloları, kredi yönetimi ve büyüme kararları bir arada.')}<div class="stats-grid">${stat('NAKİT',money(game.cash),'Kullanılabilir sermaye','＄')}${stat('ŞİRKET DEĞERİ',money(val),'Tüm varlıklar ve marka','◈')}${stat('TOPLAM BORÇ',money(game.debt),'Haftalık faiz %0,18','▧')}${stat('HAFTALIK NET',money(f.profit),'Beklenen faaliyet sonucu','↗',f.profit>=0?'good':'bad')}</div><div class="section-grid">${panel('Şirket Değerinin Gelişimi',`<div class="chart-panel">${lineChart('value')}</div>`,'SON 32 HAFTA')}${panel('Haftalık Kâr Eğilimi',`<div class="chart-panel">${lineChart('profit')}</div>`,'SON 32 HAFTA')}</div><div class="section-grid mt-12">${panel('Tahmini Gelir Tablosu',`<div class="list-rows">${[['Uçuş + kargo gelirleri',f.income],['Uçuş işletme giderleri',-f.routes.reduce((a,r)=>a+r.expense,0)],['Merkez işletme giderleri',-game.hubs.length*.035],['Kredi faizi',-game.debt*.0018],['NET FAALİYET KÂRI',f.profit]].map(([t,n],i)=>`<div class="row-card"><strong>${t}</strong><strong class="${n>=0?'good':'bad'}">${money(n)}</strong></div>`).join('')}</div>`,'HAFTALIK ÖNGÖRÜ')}${panel('Bilanço ve Finansman',`<div class="info-grid"><div class="info-box"><small>Filo Varlıkları</small><strong>${money(asset)}</strong></div><div class="info-box"><small>Toplam Kazanç</small><strong>${money(game.earnings)}</strong></div><div class="info-box"><small>Faiz / Hafta</small><strong>${money(game.debt*.0018)}</strong></div><div class="info-box"><small>İtibar Puanı</small><strong>${fmt(game.rep)} / 100</strong></div></div><div class="separator"></div><div class="action-row">${btn('+ 15 M$ Kredi','loan','', 'primary')}${btn('15 M$ Borç Öde','repay')}</div><p class="tip">Borç limiti 135 M$. Kredi almak hemen nakit sağlar ama haftalık faiz giderini artırır.</p>`,'FİNAN function routeModal(selectedPlane=null,selectedTo=null,editing=null){const idle=editing?game.planes.filter(p=>p.id===editing.plane):game.planes.filter(p=>p.route===null);if(!idle.length&&!editing){toast('Önce filona boşta bir uçak ekle.','error');shopModal();return}const base=editing||{from:game.hubs[0],to:selectedTo||D.CITIES.find(c=>c.id!==game.hubs[0]).id,plane:selectedPlane||idle[0].id,trips:7,price:1,marketing:1};const planes=idle;const defaultPl=planes.some(p=>p.id===base.plane)?base.plane:planes[0].id;

function updateRoutePreview(){const form=$('#route-form');if(!form)return;const fd=new FormData(form),from=fd.get('from'),to=fd.get('to'),id=Number(fd.get('plane')),pl=aircraft(id);const out=$('#route-preview'),hint=$('#route-max');if(!city(from)||!city(to)||!pl||from===to){out.innerHTML='<span class="bad">Geçerli bir rota seç.</span>';hint.textContent='';return;}const km=E.distance(from,to),model=plane(pl.model);if(km>model.range){out.innerHTML=`<div class="bad">⚠ Menzil yetersiz! ${fmt(km)} km rota için bu uçağın kapasitesi ${fmt(model.range)} km.</div>`;hint.textContent='';return;}const max=E.maxTrips(pl,km,game);hint.textContent=`Bu uçakla en fazla ${max} gidiş-dönüş / hafta`;const r={id:0,from,to,plane:id,trips:Math.min(max,Math.max(1,Number(fd.get('trips'))||1)),price:Number(fd.get('price'))/100,marketing:Number(fd.get('marketing')),active:true};const t=E.calcRoute(game,r);$('#fare-label').textContent='%'+fd.get('price');out.innerHTML=`<div class="preview-grid"><div><small>Mesafe</small><strong>${fmt(km)} km</strong></div><div><small>Beklenen doluluk</small><strong>%${fmt(t.load*100)}</strong></div><div><small>Haftalık kâr</small><strong class="${t.profit>=0?'good':'bad'}">${money(t.profit)}</strong></div></div><div class="tip">Tahmini bilet: $${fmt(t.fare)} · ${fmt(t.passengers)} yolcu · ${r.trips} gidiş-dönüş</div>`}

function hubModal(){const other=D.CITIES.filter(c=>!game.hubs.includes(c.id));modal(`${modalHead('Yeni Uçuş Merkezi Aç','Yeni ana üsler açarak farklı şehirlerden rota başlatabilirsin.')}<form id="hub-form"><div class="field"><label>ŞEHİR</label><select name="id">${other.map(c=>`<option value="${c.id}">${esc(c.name)} (${c.id}) · ${money(E.hubCost(game,c.id))}</option>`).join('')}</select></div><div class="preview"><small class="tiny">Merkez açma bedeli tek seferliktir; haftalık işletme masrafı da oluşur.</small></div><div class="modal-actions">${btn('Vazgeç','close')}<button class="btn btn-primary" type="submit">Yeni Merkez Aç</button></div></form>`)}
function cityModal(id){const c=city(id);if(!c)return;const km=E.distance(game.hub,c.id),hub=game.hubs.includes(id),served=game.routes.some(r=>r.to===id);modal(`${modalHead(`${c.name} · ${c.id}`,`${c.country} · Bölgesel talep endeksi ${c.demand}`)}<div class="info-grid"><div class="info-box"><small>Başlangıç merkezinden mesafe</small><strong>${fmt(km)} km</strong></div><div class="info-box"><small>Ortalama bilet (öngörü)</small><strong>$${fmt(E.calcFare(game.hub,id))}</strong></div><div class="info-box"><small>Talep endeksi</small><strong>${c.demand}</strong></div><div class="info-box"><small>Turizm katsayısı</small><strong>${fmt(c.tourism)}x</strong></div></div><div class="modal-actions">${btn('Kapat','close')}${!hub?btn(`Merkez Aç ${money(E.hubCost(game,id))}`,'hub-city',`data-city="${id}"`):''}${!served?btn('Bu Şehre Rota Aç','route-city',`data-city="${id}"`,'primary'):''}</div>`)}
function eventModal(){const e=D.EVENTS.find(x=>x.id===game.pendingEvent);if(!e)return;modal(`<div class="event-emoji">${e.emoji}</div>${modalHead(e.title,e.desc,false)}<div class="separator"></div><div class="eyebrow">YÖNETİM KURULU · KARAR GEREKLİ</div>${e.options.map((o,i)=>`<button class="event-option" data-action="event-choice" data-index="${i}">${esc(o.label)} ${o.rep?`· İtibar ${o.rep>0?'+':''}${o.rep}`:''}</button>`).join('')}<p class="tip">Bu kararın finansal etkisi hemen, operasyonel etkisi takip eden haftalarda görülür.</p>`)}
function confirmModal(title,text,action,id){modal(`${modalHead(title,text)}<div class="modal-actions">${btn('Vazgeç','close')}${btn('Evet, Onayla',action,`data-id="${id}"`,'red')}</div>`)}
function after(result,msg){if(result?.ok){save();closeModal();render();if(msg)toast(msg)}else toast(result?.error||'İşlem başarısız.','error')}
function action(el){const a=el.dataset.action,id=el.dataset.id;
if(a.startsWith('industry-')){
 const I=E.industry;let result=null;
 if(a==='industry-hub'){window.SKY_INDUSTRY_UI.filter.hub=id;render();return;}
 const [part,other]=(id||'').split(':');
 if(a==='industry-slot')result=I.slot(game,id);
 else if(a==='industry-corporate')result=I.corporate(game,id);
 else if(a==='industry-wave')result=I.wave(game,part,other);
 else if(a==='industry-vendor')result=I.vendor(game,id);
 else if(a==='industry-order')result=I.order(game,id);
 else if(a==='industry-tactic')result=I.tactic(game,id);
 else if(a==='industry-safety')result=I.safety(game,id);
 else if(a==='industry-labor')result=I.labor(game,id);
 else if(a==='industry-contingency')result=I.contingency(game,id);
 else if(a==='industry-ancillary')result=I.ancillary(game,id);
 else if(a==='industry-bond')result=I.bond(game,id);
 if(result){after(result,'Yeni şirket kararı uygulandı.');return;}
 return;
}
if(a.startsWith('mega-')){
 const M=E.mega;let result=null;
 if(a==='mega-filter-lab'){window.SKY_MEGA_UI.filter.labDomain=id;render();return}
 if(a==='mega-filter-project'){window.SKY_MEGA_UI.filter.projectFamily=id;render();return}
 if(a==='mega-research')result=M.research(game,id);
 else if(a==='mega-project')result=M.project(game,id);
 else if(a==='mega-insurance')result=M.setInsurance(game,id);
 else if(a==='mega-club')result=M.setClub(game,id);
 else if(a==='mega-training')result=M.train(game);
 else if(a==='mega-retrofit'){const [pid,part]=(id||'').split(':');result=M.retrofit(game,Number(pid),part)}
 if(result){after(result,'Yeni yönetim sistemi aktif.');return}
 return;
}

if(a.startsWith('exp-')){const X=E.expansion;let result=null; if(a==='exp-policy')result=X.setPolicy(game,id);else if(a==='exp-maint')result=X.setMaintenance(game,id);else if(a==='exp-hire')result=X.upgradeStaff(game,id);else if(a==='exp-hub')result=X.hubUpgrade(game,id);else if(a==='exp-alliance')result=X.joinAlliance(game,id);else if(a==='exp-campaign')result=X.launchCampaign(game,id);else if(a==='exp-hedge')result=X.hedgeFuel(game);else if(a==='exp-contract')result=X.signCargo(game,id);else if(a.startsWith('exp-cargo-'))result=X.setCargo(game,id,a.slice('exp-cargo-'.length));else if(a.startsWith('exp-tariff-'))result=X.setTariff(game,id,a.slice('exp-tariff-'.length));else if(a==='exp-go-routes'){view='routes';render();return;}if(result){after(result,result.ok?'Yönetim kararı uygulandı.':'');return;}return;}
 if(a==='close'){closeModal();return;}if(a==='market-filter'){marketFilter=id;render();return;}if(a==='research-filter'){researchFilter=id;render();return;}if(a==='advance'){const result=E.advance(game,Number(el.dataset.weeks));save();render();if(result.reports?.length)toast(`${result.reports.length} hafta geçti · Son haftanın net kârı ${money(result.reports.at(-1).profit)}`);else if(result.error)toast(result.error,'error');return;}
if(a==='new-game'){confirmModal('Yeni kariyer başlatılsın mı?','Mevcut kayıt silinecek. Önce yedek almayı unutma.','reset-confirm','1');return}
if(a==='reset-confirm'){game=null;try{localStorage.removeItem(KEY)}catch(_e){}welcome();return}
if(a==='route-new'){routeModal(el.dataset.plane?Number(el.dataset.plane):null);return}
if(a==='route-city'){closeModal();routeModal(null,el.dataset.city);return}
if(a==='route-edit'){routeModal(null,null,game.routes.find(r=>r.id===Number(id)));return}
if(a==='route-remove'){confirmModal('Uçuş hattı kapatılsın mı?','Uçak tekrar boşta olacak. Hat açma maliyetini geri alamazsın.','route-remove-confirm',id);return}
if(a==='route-remove-confirm'){after(E.removeRoute(game,Number(id)),'Uçuş hattı kapatıldı.');return}
if(a==='route-toggle'){const r=game.routes.find(r=>r.id===Number(id));after(E.editRoute(game,r.id,{active:!r.active}),r.active?'Rota yeniden açıldı.':'Rota durduruldu.');return}
if(a==='plane-shop'){shopModal();return}
if(a==='buy-plane'||a==='lease-plane'){after(E.buyPlane(game,id,a==='lease-plane'),'Filoya yeni uçak katıldı!');return}
if(a==='plane-service'){after(E.servicePlane(game,Number(id)),'Uçak bakımdan çıktı.');return}
if(a==='plane-sell'){confirmModal('Uçak filodan çıkarılsın mı?','İşlem geri alınamaz ve uçak ikinci el fiyatından satılır.','plane-sell-confirm',id);return}
if(a==='plane-sell-confirm'){after(E.sellPlane(game,Number(id)),'Filo güncellendi.');return}
if(a==='hub-new'){hubModal();return}
if(a==='hub-city'){after(E.openHub(game,el.dataset.city),'Yeni merkez açıldı!');return}
if(a==='market-city'){cityModal(el.dataset.city);return}
if(a==='research'){after(E.research(game,id),'Yeni teknoloji devrede!');return}
if(a==='claim'){after(E.claimContract(game,id),'Görev ödülü hesabına eklendi!');return}
if(a==='loan'){after(E.takeLoan(game),'15 M$ nakit hesabına eklendi.');return}
if(a==='repay'){after(E.repayLoan(game),'Kredi geri ödemesi tamamlandı.');return}
if(a==='event-choice'){after(E.resolveEvent(game,Number(el.dataset.index)),'Karar uygulandı.');return}
if(a==='save-now'){save();toast('Oyun bu cihaza kaydedildi.');return}
if(a==='export'){downloadSave();return}
if(a==='import'){$('#import-input')?.click();return}
}
function downloadSave(){const blob=new Blob([JSON.stringify(game,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=`skyline-empire-hafta-${game.week}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Kayıt dosyan hazır.');}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){view=nav.dataset.view;$('.sidebar').classList.remove('menu-open');render();window.scrollTo({top:0,behavior:'instant'});return}const el=e.target.closest('[data-action]');if(el)action(el)});
document.addEventListener('input',e=>{if(e.target.closest('#route-form'))updateRoutePreview()});
document.addEventListener('change',e=>{if(e.target.matches('[data-mega-profile]')){after(E.mega.setProfile(game,Number(e.target.dataset.megaProfile),e.target.value),'Kabin stratejisi güncellendi.');return;}if(e.target.closest('#route-form'))updateRoutePreview();if(e.target.id==='import-input'){const file=e.target.files?.[0];if(!file)return;if(file.size>2000000){toast('Kayıt dosyası çok büyük.','error');return;}file.text().then(t=>{try{const s=JSON.parse(t);if(!E.validateSave(s))throw Error('Geçersiz kayıt dosyası.');game=s;E.expansion.ensure(game);E.mega.ensure(game);E.industry.ensure(game);save();render();toast('Kayıt yüklendi.')}catch(ex){toast('Yüklenemedi: '+ex.message,'error')}})}});
document.addEventListener('submit',e=>{if(e.target.id==='new-game-form'){e.preventDefault();const d=new FormData(e.target);game=E.newGame({name:d.get('name'),hub:d.get('hub'),difficulty:d.get('difficulty'),seed:(Date.now()>>>0)});save();$('#modal-root').innerHTML='';render();toast('Havayolun kuruldu. Gökyüzüne hoş geldin!');return}if(e.target.id==='hub-form'){e.preventDefault();const d=new FormData(e.target);after(E.openHub(game,d.get('id')),'Yeni uçuş merkezi kuruldu!');return}if(e.target.id==='route-form'){e.preventDefault();const d=new FormData(e.target),edit=e.target.dataset.edit;const o={from:d.get('from')||undefined,to:d.get('to')||undefined,plane:d.get('plane')||undefined,trips:Number(d.get('trips')),price:Number(d.get('price'))/100,marketing:Number(d.get('marketing'))};const r=edit?E.editRoute(game,Number(edit),o):E.addRoute(game,o);after(r,edit?'Rota tarifesi güncellendi.':'Yeni rota hizmete açıldı!');return}});
$('#mobile-menu').addEventListener('click',()=>$('.sidebar').classList.toggle('menu-open'));
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
render();
})();

</script>
</body>
</html>
