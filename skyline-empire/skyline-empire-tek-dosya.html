for(const a of D.ACHIEVEMENTS){if(!s.achievements.includes(a.id)&&metric(s,a.type)>=a.goal){s.achievements.push(a.id);s.cash=round(s.cash+a.bonus);eventLog(s,'Başarım: '+a.name,`Ödül: +${a.bonus} M$`, 'good')}}
}
function tick(s){if(s.bankrupt)return {ok:false,error:'Şirket iflas etti.'};if(s.pendingEvent)return {ok:false,error:'Önce bekleyen olayla ilgili karar vermelisin.'};
const weekly=s.routes.filter(r=>r.active).map(r=>calcRoute(s,r,true));let income=0,expense=0,pax=0,flights=0;
for(const r of weekly){income+=r.income;expense+=r.expense;pax+=r.passengers;flights+=r.trips*2;const p=byId(s.planes,byId(s.routes,r.id).plane);if(p){p.wear=round(clamp(p.wear+r.trips*.095*(hasUpgrade(s,'maintenance')?.82:1),0,100),1);if(p.wear>=98){byId(s.routes,r.id).active=false;eventLog(s,'Uçak bakıma alındı',`${p.name} aşırı yıpranma nedeniyle seferden çekildi. Bakım yaparak rotayı yeniden açabilirsin.`, 'bad')}}byId(s.routes,r.id).last=r;}
const fixed=s.hubs.length*.035+s.debt*.0018;expense+=fixed;
const profit=round(income-expense);
s.cash=round(s.cash+profit);s.earnings=round(s.earnings+profit);s.pax+=pax;s.flights+=flights;s.experience+=Math.round(pax/80+weekly.length*8);s.week++;
let repDelta=(weekly.length&&weekly.reduce((a,r)=>a+r.load,0)/weekly.length>.65?.19:-.06)+(hasUpgrade(s,'loyalty')?.08:0)+(hasUpgrade(s,'eco')?.05:0)+(hasUpgrade(s,'academy')?.05:0);s.rep=round(clamp(s.rep+repDelta,0,100),1);
for(const effect of s.effects)effect.weeks--;s.effects=s.effects.filter(e=>e.weeks>0);
for(const r of s.rivals)r.share=round(clamp(r.share+(rng(s)-.5)*.45+r.growth*.012,5,31),2);
s.lastReport={week:s.week-1,income:round(income),expenses:round(expense),profit,passengers:pax,flights,load:weekly.length?round(weekly.reduce((a,r)=>a+r.load,0)/weekly.length,3):0};
s.history.push({week:s.week-1,cash:round(s.cash,2),value:valuation(s),profit,passengers:pax});s.history=s.history.slice(-120);
if(profit<0)s.consecutiveLoss++;else s.consecutiveLoss=0;
if(s.week%8===0)eventLog(s,'8 haftalık faaliyet raporu',`${pax.toLocaleString('tr-TR')} yolcu taşındı. Geçen hafta ${profit>=0?'kâr':'zarar'}: ${Math.abs(profit).toFixed(2)} M$.`,profit>=0?'good':'bad');
refreshProgress(s);
if(s.cash<-15){s.bankrupt=true;eventLog(s,'İflas!','Şirketin nakit rezervi kritik seviyeye düştü. Yeni bir kariyer başlat.','bad')}
else if(s.week>=5&&rng(s)<.13&&!s.pendingEvent){const e=D.EVENTS[Math.floor(rng(s)*D.EVENTS.length)];s.pendingEvent=e.id}
return {ok:true,report:s.lastReport,pendingEvent:s.pendingEvent};}
function advance(s,n=1){const reports=[];for(let i=0;i<clamp(n,1,52);i++){const r=tick(s);if(!r.ok)return {ok:reports.length>0,reports,error:r.error};reports.push(r.report);if(r.pendingEvent||s.bankrupt)break}return {ok:true,reports,pendingEvent:s.pendingEvent}}
function resolveEvent(s,choice){const e=byId(D.EVENTS,s.pendingEvent);if(!e)return {ok:false,error:'Bekleyen olay yok.'};const o=e.options[choice];if(!o)return {ok:false,error:'Geçersiz seçim.'};if(o.cash<0&&s.cash+o.cash<-15)return {ok:false,error:'Bu kararı finanse edecek nakit yok.'};s.cash=round(s.cash+(o.cash||0));s.debt=round(s.debt+(o.debt||0));s.rep=round(clamp(s.rep+(o.rep||0),0,100));if(o.effect)s.effects.push({...o.effect});s.pendingEvent=null;eventLog(s,e.title,o.label,o.rep>=0?'good':'neutral');return {ok:true}}
function buyPlane(s,modelId,lease=false){const m=byId(D.AIRCRAFT,modelId);if(!m)return {ok:false,error:'Uçak modeli bulunamadı.'};if(m.level>s.level)return {ok:false,error:`Bu uçak için seviye ${m.level} gerekli.`};const cost=lease?round(m.price*.08):m.price;if(s.cash<cost)return {ok:false,error:'Yetersiz nakit.'};s.cash=round(s.cash-cost);const count=s.planes.filter(p=>p.model===m.id).length+1;s.planes.push({id:s.nextId++,model:m.id,name:`${m.name.split(' ')[0]} ${String(count).padStart(2,'0')}`,wear:0,leased:lease,route:null});eventLog(s,'Filoya yeni uçak katıldı',`${m.name} ${lease?'kiralandı':'satın alındı'}.`, 'good');refreshProgress(s);return {ok:true}}
function sellPlane(s,id){const p=byId(s.planes,id);if(!p)return {ok:false,error:'Uçak bulunamadı.'};if(p.route!==null)return {ok:false,error:'Önce uçağın rotasını kaldır.'};const m=planeModel(p);const refund=p.leased?round(m.price*.025):round(m.price*(.68-p.wear*.003));s.cash=round(s.cash+refund);s.planes=s.planes.filter(x=>x.id!==id);eventLog(s,'Filo güncellendi',`${m.name} filodan çıkarıldı (+${refund} M$).`);return {ok:true}}
function servicePlane(s,id){const p=byId(s.planes,id);if(!p)return {ok:false,error:'Uçak bulunamadı.'};const cost=round(Math.max(.2,planeModel(p).price*.018)*(p.wear/50+.25),2);if(s.cash<cost)return {ok:false,error:'Bakım için yeterli nakit yok.'};s.cash=round(s.cash-cost);p.wear=0;eventLog(s,'Bakım tamamlandı',`${p.name} bakım gördü. Maliyet: ${cost} M$.`,'good');return {ok:true}}
function addRoute(s,{from,to,plane,trips=7,price=1,marketing=1}){plane=Number(plane);trips=Number(trips);price=Number(price);marketing=Number(marketing);const pl=byId(s.planes,plane);if(!s.hubs.includes(from))return {ok:false,error:'Kalkış noktası şirket merkezlerinden biri olmalı.'};if(!byId(D.CITIES,to)||from===to)return {ok:false,error:'Geçerli bir varış noktası seç.'};if(!pl||pl.route!==null)return {ok:false,error:'Uygun, boşta bir uçak seç.'};const km=distance(from,to);if(km>planeModel(pl).range)return {ok:false,error:'Bu uçak seçilen rotanın menziline yetmiyor.'};if(s.routes.some(r=>r.from===from&&r.to===to))return {ok:false,error:'Bu yönde zaten bir rotan var.'};if(!Number.isFinite(price)||price<.65||price>1.7||!Number.isInteger(marketing)||marketing<0||marketing>3||!Number.isInteger(trips)||trips<1||trips>maxTrips(pl,km,s))return {ok:false,error:'Sefer, fiyat veya pazarlama değerleri geçersiz.'};const cost=.55+km*.00008;if(s.cash<cost)return {ok:false,error:'Hat açma maliyetini karşılayamıyorsun.'};s.cash=round(s.cash-cost);const id=s.nextId++;s.routes.push({id,from,to,plane,trips,price,marketing,active:true,last:null});pl.route=id;eventLog(s,'Yeni uçuş hattı!',`${from} → ${to} hizmete açıldı.`, 'good');refreshProgress(s);return {ok:true}}
function editRoute(s,id,patch){const r=byId(s.routes,id);if(!r)return {ok:false,error:'Rota bulunamadı.'};const pl=byId(s.planes,r.plane);const t=patch.trips===undefined?r.trips:Number(patch.trips),p=patch.price===undefined?r.price:Number(patch.price),m=patch.marketing===undefined?r.marketing:Number(patch.marketing);if(!Number.isInteger(t)||t<1||t>maxTrips(pl,distance(r.from,r.to),s)||!Number.isFinite(p)||p<.65||p>1.7||!Number.isInteger(m)||m<0||m>3)return {ok:false,error:'Geçersiz rota ayarı.'};r.trips=t;r.price=p;r.marketing=m;if(patch.active!==undefined){if(patch.active&&pl.wear>=98)return {ok:false,error:'Uçak önce bakım görmeli.'};r.active=!!patch.active}eventLog(s,'Rota tarifesi güncellendi',`${r.from} → ${r.to}`);return {ok:true}}
function removeRoute(s,id){const r=byId(s.routes,id);if(!r)return {ok:false,error:'Rota bulunamadı.'};const p=byId(s.planes,r.plane);if(p)p.route=null;s.routes=s.routes.filter(x=>x.id!==id);eventLog(s,'Rota kapatıldı',`${r.from} → ${r.to} hattı kapatıldı.`);return {ok:true}}
function openHub(s,id){const c=byId(D.CITIES,id);if(!c)return {ok:false,error:'Şehir bulunamadı.'};if(s.hubs.includes(id))return {ok:false,error:'Bu şehirde zaten merkezin var.'};const cost=hubCost(s,id);if(s.cash<cost)return {ok:false,error:'Yeni merkez için nakit yetersiz.'};s.cash=round(s.cash-cost);s.hubs.push(id);eventLog(s,'Yeni uçuş merkezi',`${c.name} artık ana üslerinden biri!`,'good');return {ok:true}}
function hubCost(s,id){const c=byId(D.CITIES,id);return round(7+c.demand*.075+(c.region>=3?5:0),1)}
function research(s,id){const u=byId(D.UPGRADES,id);if(!u)return {ok:false,error:'Araştırma bulunamadı.'};if(s.upgrades.includes(id))return {ok:false,error:'Bu geliştirme zaten açılmış.'};if(s.level<u.level)return {ok:false,error:`Seviye ${u.level} gerekli.`};if(s.cash<u.cost)return {ok:false,error:'Araştırma için nakit yetersiz.'};s.cash=round(s.cash-u.cost);s.upgrades.push(id);eventLog(s,'Araştırma tamamlandı',u.name+' aktif.','good');return {ok:true}}
function takeLoan(s){if(s.debt+15>135)return {ok:false,error:'Kredi limitine ulaştın.'};s.cash=round(s.cash+15);s.debt=round(s.debt+15);eventLog(s,'Yeni kredi','15 M$ finansman sağlandı.');return {ok:true}}

modal(`${modalHead(editing?'Uçuş Tarifesini Düzenle':'Yeni Uçuş Hattı','Doğru uçak, doluluk ve fiyat dengesiyle kârını artır.')}
<form id="route-form" data-edit="${editing?.id||''}"><div class="form-grid"><div class="field"><label>KALKIŞ MERKEZİ</label><select name="from" ${editing?'disabled':''}>${game.hubs.map(id=>`<option value="${id}" ${base.from===id?'selected':''}>${esc(city(id).name)} (${id})</option>`).join('')}</select></div><div class="field"><label>VARIŞ HAVALİMANI</label><select name="to" ${editing?'disabled':''}>${D.CITIES.map(c=>`<option value="${c.id}" ${base.to===c.id?'selected':''}>${esc(c.name)} (${c.id})</option>`).join('')}</select></div><div class="field field-full"><label>ATANACAK UÇAK</label><select name="plane" ${editing?'disabled':''}>${planes.map(p=>`<option value="${p.id}" ${defaultPl===p.id?'selected':''}>${esc(plane(p.model).name)} · ${plane(p.model).seats} koltuk · ${fmt(plane(p.model).range)} km menzil</option>`).join('')}</select></div><div class="field"><label>HAFTALIK GİDİŞ-DÖNÜŞ SEFERİ</label><input type="number" name="trips" min="1" max="14" value="${base.trips}" required><div class="field-hint" id="route-max"></div></div><div class="field"><label>PAZARLAMA</label><select name="marketing">${[['0','Yok'],['1','Temel'],['2','Bölgesel'],['3','Yoğun']].map(([k,n])=>`<option value="${k}" ${base.marketing===Number(k)?'selected':''}>${n}</option>`).join('')}</select></div><div class="field field-full"><label>BİLET FİYATI ÇARPANI <strong id="fare-label" class="good">%${Math.round(base.price*100)}</strong></label><input name="price" type="range" min="65" max="170" value="${Math.round(base.price*100)}" step="5"><div class="field-hint">Düşük fiyat daha fazla yolcu; yüksek fiyat daha yüksek bilet geliri sağlar.</div></div></div><div class="preview" id="route-preview"></div><div class="modal-actions">${btn('Vazgeç','close')}<button type="submit" class="btn btn-primary">${editing?'Tarifeyi Kaydet':'Rotayı Aç · 0.5M$+'}</button></div></form>`,true);updateRoutePreview();}
function updateRoutePreview(){const form=$('#route-form');if(!form)return;const fd=new FormData(form),from=fd.get('from'),to=fd.get('to'),id=Number(fd.get('plane')),pl=aircraft(id);const out=$('#route-preview'),hint=$('#route-max');if(!city(from)||!city(to)||!pl||from===to){out.innerHTML='<span class="bad">Geçerli bir rota seç.</span>';hint.textContent='';return;}const km=E.distance(from,to),model=plane(pl.model);if(km>model.range){out.innerHTML=`<div class="bad">⚠ Menzil yetersiz! ${fmt(km)} km rota için bu uçağın kapasitesi ${fmt(model.range)} km.</div>`;hint.textContent='';return;}const max=E.maxTrips(pl,km,game);hint.textContent=`Bu uçakla en fazla ${max} gidiş-dönüş / hafta`;const r={id:0,from,to,plane:id,trips:Math.min(max,Math.max(1,Number(fd.get('trips'))||1)),price:Number(fd.get('price'))/100,marketing:Number(fd.get('marketing')),active:true};const t=E.calcRoute(game,r);$('#fare-label').textContent='%'+fd.get('price');out.innerHTML=`<div class="preview-grid"><div><small>Mesafe</small><strong>${fmt(km)} km</strong></div><div><small>Beklenen doluluk</small><strong>%${fmt(t.load*100)}</strong></div><div><small>Haftalık kâr</small><strong class="${t.profit>=0?'good':'bad'}">${money(t.profit)}</strong></div></div><div class="tip">Tahmini bilet: $${fmt(t.fare)} · ${fmt(t.passengers)} yolcu · ${r.trips} gidiş-dönüş</div>`}
function shopModal(){modal(`${modalHead('Uçak Pazarı','Filonu büyüt. Uçak satın al veya kiralayarak hemen büyümeye başla.')}<div class="list-rows">${D.AIRCRAFT.map(m=>`<div class="row-card"><div style="flex:1"><strong>${esc(m.name)} ${m.level>game.level?tag('LV '+m.level,'amber'):''}</strong><small>${m.seats} koltuk · ${fmt(m.range)} km · ${esc(m.type)}</small></div><div class="row-right"><strong>${money(m.price)}</strong><small>Alış fiyatı</small><div class="action-row mt-12">${btn('Satın Al','buy-plane',`data-id="${m.id}" ${m.level>game.level||game.cash<m.price?'disabled':''}`,'primary')}${btn('Kirala','lease-plane',`data-id="${m.id}" ${m.level>game.level||game.cash<m.price*.08?'disabled':''}`)}</div></div></div>`).join('')}</div><p class="tip">Kiralık uçaklar peşin fiyatın %8'ine katılır; her hafta uçak fiyatının %0,25'i kadar kira gideri oluşur. Fiyatlar oyun dengesi içindir.</p>`,true)}
function hubModal(){const other=D.CITIES.filter(c=>!game.hubs.includes(c.id));modal(`${modalHead('Yeni Uçuş Merkezi Aç','Yeni ana üsler açarak farklı şehirlerden rota başlatabilirsin.')}<form id="hub-form"><div class="field"><label>ŞEHİR</label><select name="id">${other.map(c=>`<option value="${c.id}">${esc(c.name)} (${c.id}) · ${money(E.hubCost(game,c.id))}</option>`).join('')}</select></div><div class="preview"><small class="tiny">Merkez açma bedeli tek seferliktir; haftalık işletme masrafı da oluşur.</small></div><div class="modal-actions">${btn('Vazgeç','close')}<button class="btn btn-primary" type="submit">Yeni Merkez Aç</button></div></form>`)}
function cityModal(id){const c=city(id);if(!c)return;const km=E.distance(game.hub,c.id),hub=game.hubs.includes(id),served=game.routes.some(r=>r.to===id);modal(`${modalHead(`${c.name} · ${c.id}`,`${c.country} · Bölgesel talep endeksi ${c.demand}`)}<div class="info-grid"><div class="info-box"><small>Başlangıç merkezinden mesafe</small><strong>${fmt(km)} km</strong></div><div class="info-box"><small>Ortalama bilet (öngörü)</small><strong>$${fmt(E.calcFare(game.hub,id))}</strong></div><div class="info-box"><small>Talep endeksi</small><strong>${c.demand}</strong></div><div class="info-box"><small>Turizm katsayısı</small><strong>${fmt(c.tourism)}x</strong></div></div><div class="modal-actions">${btn('Kapat','close')}${!hub?btn(`Merkez Aç ${money(E.hubCost(game,id))}`,'hub-city',`data-city="${id}"`):''}${!served?btn('Bu Şehre Rota Aç','route-city',`data-city="${id}"`,'primary'):''}</div>`)}
function eventModal(){const e=D.EVENTS.find(x=>x.id===game.pendingEvent);if(!e)return;modal(`<div class="event-emoji">${e.emoji}</div>${modalHead(e.title,e.desc,false)}<div class="separator"></div><div class="eyebrow">YÖNETİM KURULU · KARAR GEREKLİ</div>${e.options.map((o,i)=>`<button class="event-option" data-action="event-choice" data-index="${i}">${esc(o.label)} ${o.rep?`· İtibar ${o.rep>0?'+':''}${o.rep}`:''}</button>`).join('')}<p class="tip">Bu kararın finansal etkisi hemen, operasyonel etkisi takip eden haftalarda görülür.</p>`)}
function confirmModal(title,text,action,id){modal(`${modalHead(title,text)}<div class="modal-actions">${btn('Vazgeç','close')}${btn('Evet, Onayla',action,`data-id="${id}"`,'red')}</div>`)}
function after(result,msg){if(result?.ok){save();closeModal();render();if(msg)toast(msg)}else toast(result?.error||'İşlem başarısız.','error')}
function action(el){const a=el.dataset.action,id=el.dataset.id; if(a==='close'){closeModal();return;}if(a==='market-filter'){marketFilter=id;render();return;}if(a==='research-filter'){researchFilter=id;render();return;}if(a==='advance'){const result=E.advance(game,Number(el.dataset.weeks));save();render();if(result.reports?.length)toast(`${result.reports.length} hafta geçti · Son haftanın net kârı ${money(result.reports.at(-1).profit)}`);else if(result.error)toast(result.error,'error');return;}
if(a==='new-game'){confirmModal('Yeni kariyer başlatılsın mı?','Mevcut kayıt silinecek. Önce yedek almayı unutma.','reset-confirm','1');return}
if(a==='reset-confirm'){game=null;try{localStorage.removeItem(KEY)}catch(_e){}welcome();return}
if(a==='route-new'){routeModal(el.dataset.plane?Number(el.dataset.plane):null);return}
if(a==='route-city'){closeModal();routeModal(null,el.dataset.city);return}
if(a==='route-edit'){routeModal(null,null,game.routes.find(r=>r.id===Number(id)));return}
if(a==='route-remove'){confirmModal('Uçuş hattı kapatılsın mı?','Uçak tekrar boşta olacak. Hat açma maliyetini geri alamazsın.','route-remove-confirm',id);return}
if(a==='route-remove-confirm'){after(E.removeRoute(game,Number(id)),'Uçuş hattı kapatıldı.');return}
if(a==='route-toggle'){const r=game.routes.find(r=>r.id===Number(id));after(E.editRoute(game,r.id,{active:!r.active}),r.active?'Rota yeniden açıldı.':'Rota durduruldu.');return}
if(a==='plane-shop'){shopModal();return}
if(a==='buy-plane'||a==='lease-plane'){after(E.buyPlane(game,id,a==='lease-plane'),'Filoya yeni uçak katıldı!');return}
if(a==='plane-service'){after(E.servicePlane(game,Number(id)),'Uçak bakımdan çıktı.');return}
if(a==='plane-sell'){confirmModal('Uçak filodan çıkarılsın mı?','İşlem geri alınamaz ve uçak ikinci el fiyatından satılır.','plane-sell-confirm',id);return}
if(a==='plane-sell-confirm'){after(E.sellPlane(game,Number(id)),'Filo güncellendi.');return}
if(a==='hub-new'){hubModal();return}
if(a==='hub-city'){after(E.openHub(game,el.dataset.city),'Yeni merkez açıldı!');return}
if(a==='market-city'){cityModal(el.dataset.city);return}
if(a==='research'){after(E.research(game,id),'Yeni teknoloji devrede!');return}
if(a==='claim'){after(E.claimContract(game,id),'Görev ödülü hesabına eklendi!');return}
if(a==='loan'){after(E.takeLoan(game),'15 M$ nakit hesabına eklendi.');return}
if(a==='repay'){after(E.repayLoan(game),'Kredi geri ödemesi tamamlandı.');return}
if(a==='event-choice'){after(E.resolveEvent(game,Number(el.dataset.index)),'Karar uygulandı.');return}
if(a==='save-now'){save();toast('Oyun bu cihaza kaydedildi.');return}
if(a==='export'){downloadSave();return}
if(a==='import'){$('#import-input')?.click();return}
}
function downloadSave(){const blob=new Blob([JSON.stringify(game,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=`skyline-empire-hafta-${game.week}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Kayıt dosyan hazır.');}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){view=nav.dataset.view;$('.sidebar').classList.remove('menu-open');render();window.scrollTo({top:0,behavior:'instant'});return}const el=e.target.closest('[data-action]');if(el)action(el)});
document.addEventListener('input',e=>{if(e.target.closest('#route-form'))updateRoutePreview()});
document.addEventListener('change',e=>{if(e.target.closest('#route-form'))updateRoutePreview();if(e.target.id==='import-input'){const file=e.target.files?.[0];if(!file)return;if(file.size>2000000){toast('Kayıt dosyası çok büyük.','error');return;}file.text().then(t=>{try{const s=JSON.parse(t);if(!E.validateSave(s))throw Error('Geçersiz kayıt dosyası.');game=s;save();render();toast('Kayıt yüklendi.')}catch(ex){toast('Yüklenemedi: '+ex.message,'error')}})}});
document.addEventListener('submit',e=>{if(e.target.id==='new-game-form'){e.preventDefault();const d=new FormData(e.target);game=E.newGame({name:d.get('name'),hub:d.get('hub'),difficulty:d.get('difficulty'),seed:(Date.now()>>>0)});save();$('#modal-root').innerHTML='';render();toast('Havayolun kuruldu. Gökyüzüne hoş geldin!');return}if(e.target.id==='hub-form'){e.preventDefault();const d=new FormData(e.target);after(E.openHub(game,d.get('id')),'Yeni uçuş merkezi kuruldu!');return}if(e.target.id==='route-form'){e.preventDefault();const d=new FormData(e.target),edit=e.target.dataset.edit;const o={from:d.get('from')||undefined,to:d.get('to')||undefined,plane:d.get('plane')||undefined,trips:Number(d.get('trips')),price:Number(d.get('price'))/100,marketing:Number(d.get('marketing'))};const r=edit?E.editRoute(game,Number(edit),o):E.addRoute(game,o);after(r,edit?'Rota tarifesi güncellendi.':'Yeni rota hizmete açıldı!');return}});
$('#mobile-menu').addEventListener('click',()=>$('.sidebar').classList.toggle('menu-open'));
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
render();
})();

</script>

</body>
